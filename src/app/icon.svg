  <!-- Background badge -->
  <rect width="32" height="32" rx="7" fill="#f8f5ee" stroke="#b38b4d" stroke-width="1.2" />

  <!-- Fountain Pen Nib -->
  <!-- Main Nib Outer Shape -->
