      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#b38b4d" />
      <stop offset="100%" stop-color="#8c6828" />
    </linearGradient>
    <linearGradient id="crimson" x1="0%" y1="0%" x2="0%" y2="100%">
